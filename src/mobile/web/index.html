<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f1f7"><meta name="apple-mobile-web-app-capable" content="yes"><title>Sidecar · 随行</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="stylesheet" href="./style.css"></head>
<body><header><button id="back" class="icon" aria-label="返回对话列表" hidden>‹</button><img src="./icon.svg" alt="" width="32" height="32"><div class="brand"><strong id="title">随行</strong><small id="connection">连接你的 Codex</small></div><button id="inbox" class="quiet" hidden>随手记</button><button id="logout" class="icon" aria-label="退出登录" hidden>↗</button></header>
<main><section id="pair"><p class="eyebrow">CODEX SIDECAR</p><h1>思路，<br>随你出发。</h1><p class="intro">回到电脑上的原对话。<br>从桌面 Sidecar 的「手机入口」取得配对码。</p><form id="pair-form"><label for="code">一次配对，以后直接打开</label><input id="code" autocomplete="one-time-code" placeholder="输入配对码" required maxlength="40"><button class="primary">连接我的桌面</button></form></section>
<section id="list" hidden><div class="section-head"><h1>接着聊</h1><span id="count"></span></div><input id="filter" placeholder="找一个对话…" aria-label="筛选对话"><div id="threads"></div></section>
<section id="chat" hidden><button id="older" class="quiet" hidden>更早的消息</button><div id="messages"></div></section>
<section id="ideas" hidden><p class="eyebrow">先留下，慢慢想</p><h1>随手记</h1><p class="intro">文字、照片和录音都会等待电脑上线，<br>同步到 Sidecar 后再整理。</p><div id="commands"></div></section>
<p id="notice" role="status" hidden></p></main>
<form id="composer" hidden><div id="attachments"></div><textarea id="input" placeholder="接着说…" aria-label="消息" rows="2" maxlength="30000"></textarea><div class="compose-actions"><label class="attach" aria-label="添加图片">＋<input id="file" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden></label><button id="record" type="button" class="quiet" hidden>录音</button><small id="hint">使用键盘上的麦克风可语音输入</small><button id="send" class="primary">发送</button></div></form>
<script src="./markdown.js" defer></script>
<script src="./app.js" defer></script></body></html>
