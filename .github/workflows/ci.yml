name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Windows launcher regression
        if: runner.os == 'Windows'
        shell: powershell
        run: .\test\launcher.test.ps1
      - name: Windows launcher parent-exit regression
        if: runner.os == 'Windows'
        shell: powershell
        run: .\test\launcher-lifecycle.test.ps1
